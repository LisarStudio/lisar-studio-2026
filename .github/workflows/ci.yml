name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository files
        run: |
          echo "Checking for obvious issues..."
          # Basic checks: ensure index.html exists and assets folder present
          test -f index.html || (echo "index.html missing" && exit 1)
          test -d assets || (echo "assets folder missing" && exit 1)
