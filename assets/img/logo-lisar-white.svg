<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon Badge -->
  <rect x="5" y="6" width="48" height="48" rx="14" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  <text x="29" y="38" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#08090a" text-anchor="middle">LS</text>
  
  <!-- Typography (White Version) -->
  <text x="68" y="32" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="-0.5">LISAR STUDIO</text>
  <text x="68" y="48" font-family="'Manrope', sans-serif" font-weight="600" font-size="10" fill="#ffb703" letter-spacing="2">DISEÑO &amp; ANIMACIÓN 3D</text>
</svg>
